[package]
name = "arrowmesh"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Arrowmesh: a local model, an encrypted vault, a leak gate and sealed LAN messaging on one Linux box."

[lib]
name = "arrowmesh"
path = "src/lib.rs"

[[bin]]
name = "arrowmesh"
path = "src/main.rs"

[dependencies]
arrowmem-core = { path = "../arrowmem-core" }
arrowmem-gate = { path = "../arrowmem-gate" }
# Same exact pin as arrowmem-gate, so the two crates share one serde_json.
serde_json = "=1.0.140"
p256 = { version = "0.14", features = ["ecdsa"] }
hpke = { version = "0.15", default-features = false, features = ["nistp", "aes", "alloc", "getrandom"] }
getrandom = "0.4.3"
tiny_http = "=0.12.0"
argon2 = "=0.5.3"
aes-gcm = "=0.10.3"
subtle = "=2.6.1"
rpassword = "=7.4.0"

[dev-dependencies]
zeroize = "1.9.1"
